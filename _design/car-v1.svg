<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" role="img" aria-label="A U-Train Driving School training car">
  <title>U-Train Driving School training car</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#DCE3F2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E4F9C"/>
      <stop offset="1" stop-color="#0E2256"/>
    </linearGradient>
    <linearGradient id="skirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E2256"/>
      <stop offset="1" stop-color="#1D45A8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F5FB"/>
      <stop offset="1" stop-color="#9FAEC9"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M46 176 L46 130 Q46 118 59 115 L150 105 L202 52 Q208 46 218 46 L348 46 Q360 46 366 52 L420 110 L504 122 Q522 125 522 140 L522 176 Z"/>
    </clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="288" cy="206" rx="248" ry="12" fill="#050A17" opacity="0.28"/>

  <!-- roof sign -->
  <rect x="252" y="24" width="10" height="24" fill="#8C97AE"/>
  <rect x="312" y="24" width="10" height="24" fill="#8C97AE"/>
  <rect x="232" y="8" width="112" height="26" rx="7" fill="#E0151D"/>
  <text x="288" y="26" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif"
        font-size="13" font-weight="700" letter-spacing="1.6" fill="#ffffff">U-TRAIN</text>

  <!-- body shell -->
  <path d="M46 176 L46 130 Q46 118 59 115 L150 105 L202 52 Q208 46 218 46 L348 46 Q360 46 366 52 L420 110 L504 122 Q522 125 522 140 L522 176 Z"
        fill="url(#body)"/>

  <g clip-path="url(#bodyClip)">
    <!-- lower livery -->
    <path d="M0 148 L150 142 L300 140 L430 132 L540 136 L540 190 L0 190 Z" fill="url(#skirt)"/>
    <path d="M0 140 L150 134 L300 132 L430 124 L540 128 L540 140 L430 136 L300 144 L150 146 L0 152 Z" fill="#E0151D"/>
    <!-- glasshouse -->
    <path d="M166 104 L206 56 Q210 52 217 52 L346 52 Q353 52 357 56 L402 104 Z" fill="url(#glass)"/>
    <!-- pillars -->
    <path d="M250 52 h11 v52 h-13 z" fill="#E7ECF7"/>
    <path d="M312 52 h11 l4 52 h-15 z" fill="#E7ECF7"/>
    <!-- glass highlight -->
    <path d="M206 56 L186 104 L214 104 L240 56 Z" fill="#ffffff" opacity="0.14"/>
    <path d="M330 56 L352 104 L374 104 L348 56 Z" fill="#ffffff" opacity="0.1"/>
    <!-- door shutlines -->
    <path d="M256 108 V146 M320 110 V144" stroke="#0E2256" stroke-opacity="0.18" stroke-width="2"/>
    <!-- door handles -->
    <rect x="272" y="118" width="22" height="6" rx="3" fill="#0E2256" opacity="0.45"/>
    <rect x="336" y="118" width="22" height="6" rx="3" fill="#0E2256" opacity="0.45"/>
  </g>

  <!-- body outline -->
  <path d="M46 176 L46 130 Q46 118 59 115 L150 105 L202 52 Q208 46 218 46 L348 46 Q360 46 366 52 L420 110 L504 122 Q522 125 522 140 L522 176 Z"
        fill="none" stroke="#0E2256" stroke-opacity="0.35" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- door decal -->
  <rect x="246" y="152" width="112" height="22" rx="6" fill="#ffffff"/>
  <text x="302" y="168" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif"
        font-size="12" font-weight="700" letter-spacing="1.4" fill="#C50F1A">U-TRAIN</text>

  <!-- L plate -->
  <rect x="72" y="124" width="30" height="30" rx="4" fill="#ffffff" stroke="#0E2256" stroke-opacity=".2"/>
  <text x="87" y="148" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif"
        font-size="22" font-weight="700" fill="#E0151D">L</text>

  <!-- lamps -->
  <path d="M500 124 L520 128 Q524 132 522 138 L500 136 Z" fill="#FFD86B"/>
  <path d="M46 126 h16 a4 4 0 0 1 4 4 v8 a4 4 0 0 1 -4 4 h-16 z" fill="#E0151D"/>

  <!-- wheels -->
  <g>
    <circle cx="140" cy="176" r="38" fill="#111826"/>
    <circle cx="140" cy="176" r="21" fill="url(#rim)"/>
    <circle cx="140" cy="176" r="6" fill="#64748B"/>
    <circle cx="432" cy="176" r="38" fill="#111826"/>
    <circle cx="432" cy="176" r="21" fill="url(#rim)"/>
    <circle cx="432" cy="176" r="6" fill="#64748B"/>
  </g>
</svg>
